name: Frontend CI
on:
  push:
    branches: [main, feat/step2-frontend-pwa, feat/tracklib-inspired-landing, feat/step2-cms-polish]
  pull_request:
    branches: [main, feat/step2-frontend-pwa, feat/tracklib-inspired-landing]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
