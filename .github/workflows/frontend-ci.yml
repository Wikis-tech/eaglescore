name: Frontend CI
on:
  push:
    branches: [main, feat/step2-frontend-pwa, feat/tracklib-inspired-landing, feat/step2-cms-polish, feat/step3-supabase-auth-schema, docs/step3-manual-supabase-setup, fix/manual-admin-sql-email-setup, feat/step3-real-auth-release, feat/public-signup-admin-isolation]
  pull_request:
    branches: [main, feat/step2-frontend-pwa, feat/tracklib-inspired-landing]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  sql-policy-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eaglescore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eaglescore_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - run: bash supabase/tests/run-ci.sh
      - run: bash supabase/tests/manual-admin-flow-ci.sh
      - run: bash supabase/tests/public-signup-ci.sh

